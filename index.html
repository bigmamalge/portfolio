<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Malone Daulny</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Le conteneur qui fixe la caméra -->
    <div class="scene">
        <div class="camera">
        <!-- NOUVEAU CONTENEUR -->
            <div class="world"> 
                <!-- Plaque 1 : Parfaitement au centre, au tout début -->
                <div class="card" data-x="0" data-y="0" data-z="-500">
                    Projet 1
                </div>
                
                
                <!-- Plaque 3 : Décalée à droite (400), un peu en haut (-150), très loin (-3500) -->
                <div class="card" data-x="0" data-y="0" data-z="-5000">
                    Projet 3
                </div>

                <div class="card" data-x="0" data-y="0" data-z="-2500">
                    Projet 1
                </div>

                <div class="decor" id='decor1' data-connect-to="decor2" data-x="400" data-y="0" data-z="-3500">HTML</div>
                <div class="decor" id='decor2' data-x="700" data-y="250" data-z="-3500">CSS</div>
            </div>
        </div>
    </div>

    <!-- Import de GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
